# The serving stack for the prototype (PRD section A): Postgres 16 with PostGIS for serving, MinIO for objects
# and tiles, Redis for the job queue. DuckDB stays the analytics engine and lives in pipeline/data, not here.
# `docker compose up -d --build` brings everything up; `ue store migrate` then `ue store sync-pg` fill the
# serving database. A fresh clone has no analytics store: put a seed pack at pipeline/data/seed/latest (that
# directory is mounted into the app), or publish one to the compose MinIO (`ue store seed push <pack> --to
# s3://seeds/latest`), and the app unpacks it into pipeline/data/ue.duckdb on its first start.
# The project name fixes the image, container and volume prefixes, whatever the checkout directory is called.
name: ai-uranium-explorer
services:
  app:
    build: .
    ports: ["127.0.0.1:8787:8787"]   # the host's loopback only: with no key register the app trusts its own network
    depends_on:
      db:
        condition: service_healthy
      # MinIO is not a dependency: the app needs it only to pull a seed pack when no store is mounted, and
      # `ue store seed ensure` copes with the bucket being absent or the service being down (no-seed).
    environment:
      UE_PG_DSN: postgresql://${UE_PG_USER:-ue}:${UE_PG_PASSWORD:-ue}@db:5432/${UE_PG_DB:-ue}
      UE_S3_ENDPOINT: http://minio:9000
      UE_REDIS_URL: redis://redis:6379/0
      # the seed pack the first start unpacks when pipeline/data/ue.duckdb is missing; a container path, under
      # the mounted data directory, so a pack the host keeps at pipeline/data/seed/latest is what the app sees
      UE_SEED_DIR: /app/pipeline/data/seed/latest
      # the chat and the analyst jobs run on a pay-per-token model through OpenRouter (OPENROUTER_API_KEY in .env);
      # API first: a vendor/model id routes there, a claude-* id to OpenRouter's Anthropic listing, a gpt-* id to OpenAI
      UE_INTERFACE_MODEL: ${UE_INTERFACE_MODEL:-z-ai/glm-5.3-flash}
      # ...and when there is none there either, where `ue store seed ensure` pulls one from: the compose MinIO,
      # bucket `seeds`, prefix `latest` (what `ue store seed push <pack> --to s3://seeds/latest` writes, with
      # UE_S3_ENDPOINT=http://127.0.0.1:9000 on the host). An empty bucket is "no seed", not a failed start.
      # Written 2026-09-21 against moto's fake S3 in the test suite; not exercised against the live MinIO that
      # day (Docker was not reachable on the development machine), so the first real run is the check.
      UE_SEED_URL: s3://seeds/latest
      # the S3 client reads the standard AWS names; these are the pair MinIO below is started with
      # (MinIO refuses a root user shorter than three characters, so the default key is not the bare prefix)
      AWS_ACCESS_KEY_ID: ${UE_S3_KEY:-ue-minio}
      AWS_SECRET_ACCESS_KEY: ${UE_S3_SECRET:-ue-minio-secret}
      # traces over OTLP/HTTP to a backend, when one is running (the commented service below); unset, the
      # spans stay in each run's spans.jsonl and the MLflow mirror, and the SDK is not imported
      # UE_OTLP_ENDPOINT: http://jaeger:4318
    env_file:
      # the model keys and their spend ceilings live in the repository's .env (see .env.example); gitignored,
      # read by the container at start and never copied into the image. pipeline/.env is the serving stack's.
      - path: .env
        required: false
      - path: pipeline/.env
        required: false
    volumes: ["./pipeline/data:/app/pipeline/data"]   # the analytics store, computed on the host
  db:
    image: ghcr.io/baosystems/postgis:16-3.5   # multi-arch (arm64 + amd64); postgis/postgis has no arm64 build
    environment:
      POSTGRES_USER: ${UE_PG_USER:-ue}
      POSTGRES_PASSWORD: ${UE_PG_PASSWORD:-ue}
      POSTGRES_DB: ${UE_PG_DB:-ue}
    ports: ["127.0.0.1:${UE_PG_PORT:-5432}:5432"]
    volumes: ["ue-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UE_PG_USER:-ue} -d ${UE_PG_DB:-ue}"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    # MinIO publishes its images on Quay; the Docker Hub repository no longer carries current tags
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UE_S3_KEY:-ue-minio}
      MINIO_ROOT_PASSWORD: ${UE_S3_SECRET:-ue-minio-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["ue-minio:/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  # A trace backend, for when the machine has room for one (the development machine has 9 GB and does not):
  # Jaeger's all-in-one takes OTLP/HTTP on :4318 and shows traces on :16686. Uncomment it and the app's
  # UE_OTLP_ENDPOINT above. Grafana Tempo is the other choice the PRD names (its image needs a config file;
  # see grafana/tempo's docker-compose examples), and any OTLP backend, hosted or not, works the same way:
  # the instrumentation is OpenTelemetry, so the backend is this configuration and not a code change.
  # jaeger:
  #   image: jaegertracing/all-in-one:1.62.0
  #   environment:
  #     COLLECTOR_OTLP_ENABLED: "true"
  #   ports: ["16686:16686", "4318:4318"]
volumes:
  ue-pg: {}
  ue-minio: {}
