# Alembic for the serving database. The URL comes from UE_PG_DSN at run time (see store/pg.py: migrate).
[alembic]
script_location = migrations
sqlalchemy.url = postgresql+psycopg://ue:ue@127.0.0.1:5432/ue
[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
