# Placebo for D3: the same arm given another cell's redacted report text, by a derangement fixed by the
# benchmark seed. If D3 beats this by what it beats D2, the text about the ground is doing the work;
# if not, it is the extra reader and the extra tokens.
[arm]
name = "d3-swap"
agent = "v2"
model = "claude-opus-5"
effort = "medium"
prompt_version = "analyst/v2/v1"
max_budget_usd_per_call = 1.50
timeout_s = 600
workers = 2
notes = "D3 with each cell given another cell's redacted report text: the placebo that separates reading the ground from reading any text."
passages_view = "swapped"

[arm.inputs]
card = true
pack = true
passages = true

[arm.switches]
drillholes = false
label_context = false
oof_scores = false
effort_features = false
criteria = true
evidence = true
region = true
extended_features = true
