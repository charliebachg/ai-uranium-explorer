# Analyst_v0 arm. Every switch is stated; an arm differs from v0 in the one way its notes line names.
[arm]
name = "v0-holes"
agent = "v0"
model = "claude-opus-5"
effort = "medium"
prompt_version = "analyst/v0/v1"
max_budget_usd_per_call = 1.50
timeout_s = 600
workers = 2
notes = "How much does it lean on effort: v0 plus the drillhole rows and the effort features."

[arm.inputs]
card = true
pack = true
passages = false

[arm.switches]
drillholes = true
label_context = false
oof_scores = false
effort_features = true
criteria = true
