# Analyst v1 arm: the staged loop (PRD §8.4). Every switch is stated; an arm differs from v1 in the one way
# its notes line names.
[arm]
name = "v1-scoped"
agent = "v1"
model = "claude-opus-5"
effort = "medium"
prompt_version = "analyst/v1/v1"
max_budget_usd_per_call = 1.50
timeout_s = 600
workers = 2
notes = "Segment-scoped tool views: each executor is staged only its own criterion's rows of the feature, criteria, coverage and cross-check tables (a cross-check the rows of the two criteria it combines), where v1 stages the whole tables ten times over; the gate holds each node to what its segment saw, so this arm measures what the repetition costs in tokens and whether a narrower view changes what the executors cite."

[arm.inputs]
card = true
pack = false
passages = false

[arm.switches]
drillholes = false
label_context = false
oof_scores = false
effort_features = false
criteria = true

[arm.loop]
executor_model = "claude-sonnet-5"
verifier_model = "claude-opus-5"
adjudicator_model = "claude-opus-5"
planner_model = "claude-opus-5"
planner = "template"
verifier = "skeptic"
rounds = 3
triage = false
executor_context = "independent"
decider = "both"
segment_workers = 4
retrieval = false
skip_unmeasured = false
executor_batch = false
segment_scoped = true
