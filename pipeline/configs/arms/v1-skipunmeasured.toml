# Analyst v1 arm: the staged loop (PRD §8.4). Every switch is stated; an arm differs from v1 in the one way
# its notes line names.
[arm]
name = "v1-skipunmeasured"
agent = "v1"
model = "claude-opus-5"
effort = "medium"
prompt_version = "analyst/v1/v1"
max_budget_usd_per_call = 1.50
timeout_s = 600
workers = 2
notes = "Criteria the staged cell_features shows unmeasured are settled unknown by the harness with no executor call: 36 of 150 nodes in the enabled-cell run were unknowns the gate would have allowed nothing else for, so this arm measures what skipping them saves and whether the verifier and the deciders read the chain any differently."

[arm.inputs]
card = true
pack = false
passages = false

[arm.switches]
drillholes = false
label_context = false
oof_scores = false
effort_features = false
criteria = true

[arm.loop]
executor_model = "claude-sonnet-5"
verifier_model = "claude-opus-5"
adjudicator_model = "claude-opus-5"
planner_model = "claude-opus-5"
planner = "template"
verifier = "skeptic"
rounds = 3
triage = false
executor_context = "independent"
decider = "both"
segment_workers = 4
retrieval = false
skip_unmeasured = true
executor_batch = false
