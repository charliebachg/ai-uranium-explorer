# Opus-only reading of the enabled cells' drilling files. The timing run used one worker so wall time
# equalled model time; the full read uses two, and every page's usage is still read off calls.jsonl per
# call. The per-call budget is a ceiling the CLI enforces, not an expected spend.
[extract]
model = "claude-opus-5"
effort = "medium"
workers = 1
page_classes = ["collar_table", "assay_table", "lith_log"]
class_priority = ["assay_table", "lith_log", "collar_table", "probe_log", "certificate", "uncertain", "other"]
max_pages_per_file = 12
reask = false
validator_mode = "enforce"
max_budget_usd = 1.50
timeout_s = 600
note = "opus1 with assay and lithology pages first: the grade-bearing pages of a file before its collar tables."
