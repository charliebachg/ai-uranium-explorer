# Labelling pre-fill: Opus 5 at high effort, run once per page, never scored.
[extract]
model = "claude-opus-5"
effort = "high"
page_classes = ["collar_table", "assay_table", "lith_log", "probe_log"]
max_pages_per_file = 40
reask = true
validator_mode = "shadow"
max_budget_usd = 1.20
timeout_s = 600
note = "Pre-fill for the labelling view. Not an evaluated configuration."
