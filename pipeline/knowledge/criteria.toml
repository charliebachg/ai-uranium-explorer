# The knowledge-driven score: what a geologist looks for in Athabasca unconformity-related uranium, written so
# that every threshold can be argued with.
#
# Each criterion carries:
#   status   published  - the association is stated in a peer-reviewed or agency source
#            assumed    - the association is published but the numeric threshold here is ours
#            folklore   - recorded in the literature as personal communication with no published test
#   weight   how much it counts. FOLKLORE IS ALWAYS WEIGHT ZERO: the agent may name it, the score may not
#            depend on it.
#   evidence the published source, quoted or closely paraphrased, with its citation
#   caveat   how the criterion fails, which the skeptic is expected to use
#
# The thresholds marked `assumed` are the part a geologist should change first. They are not measurements and
# the demo does not present them as any.
#
# Membership shapes:
#   falling(lo, hi)        1 at or below lo, linear to 0 at hi          (distances: nearer is better)
#   rising(lo, hi)         0 at or below lo, linear to 1 at hi          (anomalies: higher is better)
#   band(a, b, c, d)       0 below a, 1 between b and c, 0 above d      (depth windows)
#   binary                 the feature is already 0 or 1
#   percentile_rising(p, q)  thresholds taken from this grid's own distribution, for values with no citable
#                            absolute threshold; the percentiles used are recorded with the score

schema_version = "1.0.0"

# A cell is only scored when at least this share of the weighted criteria have a value. Below it the score is
# null: most of the basin has no geochemical sample, and a score built from two criteria out of eight would say
# more about coverage than about ground.
min_known_weight = 0.5

# ---------------------------------------------------------------- pathway

[[criterion]]
key = "conductor_proximity"
title = "Close to a mapped EM conductor"
element = "pathway"
feature = "d_conductor_m"
shape = "falling"
params = { lo = 500.0, hi = 5000.0 }
weight = 3.0
status = "assumed"
evidence = """Graphitic basement units are "the source of most significant conductors in the Athabasca Basin, \
and are key empirical locators for U deposits" (Jefferson et al. 2007). \
Every Athabasca discovery since 2008 with documented targeting was drilled on an EM conductor or the fault \
corridor along it."""
caveat = """The association is published; these distances are not. A conductor trace plots up-dip of blind ore, \
so proximity marks a corridor rather than a position, and silicification can turn a graphitic gneiss from a \
conductor into a resistor, so absence of a trace is not absence of the host."""

[[criterion]]
key = "graphitic_host"
title = "Mapped bedrock names a graphitic or pelitic host"
element = "pathway"
feature = "graphitic_host"
shape = "binary"
weight = 2.0
status = "published"
evidence = """Magnetic lows mark "pelitic-psammopelitic gneiss... the host of graphitic conductors". With no public magnetic grid, the mapped lithology is the only route to that \
element."""
caveat = """A 1:250,000 polygon is a regional generalisation, and the lithology string is matched by keyword. \
Null where the map has no polygon: unmapped is not the same as absent."""

# ---------------------------------------------------------------- trap

[[criterion]]
key = "fault_proximity"
title = "Close to a mapped fault or lineament"
element = "trap"
feature = "d_fault_m"
shape = "falling"
params = { lo = 500.0, hi = 5000.0 }
weight = 2.0
status = "assumed"
evidence = """The trap is structural: "the unconformity offset where footwall faults... meet the P2 fault hosts \
the McArthur River ore pods"."""
caveat = """Mapped at 1:250,000, so a line's position carries map-scale error far larger than an ore body, and \
the intersections that matter are below this resolution."""

[[criterion]]
key = "structural_density"
title = "Several mapped structures cross the cell"
element = "trap"
feature = "fault_density"
shape = "percentile_rising"
params = { p_lo = 50.0, p_hi = 90.0 }
weight = 1.0
status = "assumed"
evidence = """Deposits sit where structures meet rather than along a single clean break; density is the \
coarsest public stand-in for an intersection."""
caveat = "Density is also a map-effort artefact: better-mapped ground carries more lines."

# ---------------------------------------------------------------- cover

[[criterion]]
key = "unconformity_depth"
title = "The unconformity sits in the depth window deposits are found in"
element = "cover"
feature = "unconformity_depth_m"
shape = "band"
params = { a = 50.0, b = 120.0, c = 700.0, d = 1000.0 }
weight = 2.0
status = "assumed"
evidence = """Known deposits span this window: Larocque East's unconformity at 175 m, Hurricane about 325 m, \
Cigar Lake 480 m, McArthur River 530 to 640 m, Arrow 100 to 900 m."""
caveat = """The window is drawn from deposits that were found, which is exactly the survival bias this demo \
measures elsewhere; and the depth itself is interpolated from holes that reached the contact, so it is null \
over undrilled ground rather than shallow."""

# ---------------------------------------------------------------- detection

[[criterion]]
key = "lake_sediment_uranium"
title = "Uranium anomaly in lake sediment nearby"
element = "detection"
feature = "sed_u_max_ppm"
shape = "percentile_rising"
params = { p_lo = 75.0, p_hi = 97.0 }
weight = 2.0
status = "assumed"
evidence = """Lake sediment carries regional uranium dispersion, sampled around the Athabasca sandstone in \
1975 to 1978 before most mining."""
caveat = """A dispersion signal says something upstream sheds uranium, not that ore is here. The sampling frame \
is lakes: a cell with no lake has no measurement, which is not a low value. Thresholds come from this grid's \
own distribution because no absolute anomaly threshold was found in the sources."""

[[criterion]]
key = "lake_water_uranium"
title = "Uranium anomaly in lake water nearby"
element = "detection"
feature = "water_u_max_ppm"
shape = "percentile_rising"
params = { p_lo = 75.0, p_hi = 97.0 }
weight = 1.0
status = "assumed"
evidence = "Lake water uranium, measured by fluorometry with pH and Eh recorded."
caveat = """566 samples over a narrow band: this criterion is unknown for 97% of the grid, and where it is known \
it should be read with the pH and Eh the survey recorded rather than as a bare concentration."""

# ---------------------------------------------------------------- dispersal

[[criterion]]
key = "boulder_train"
title = "Radioactive boulders nearby"
element = "dispersal"
feature = "boulder_max_cps"
shape = "percentile_rising"
params = { p_lo = 50.0, p_hi = 95.0 }
weight = 2.0
status = "assumed"
evidence = """At Patterson Lake, 48 boulders over 1% U3O8 were found in 2011 and the discovery hole cut over \
1% U3O8 across 8.5 m in November 2012, 3.8 km up-ice of the boulder field."""
caveat = """A train is a vector, not a location: the source lies up-ice, kilometres away, and this criterion \
scores the boulders' own cell. Until a geologist sets the ice-flow sense, no directional corridor is applied, \
so this criterion is deliberately blunt."""

# ---------------------------------------------------------------- folklore: named, never counted

[[criterion]]
key = "conductor_strength"
title = "Stronger conductors are better targets"
element = "pathway"
feature = "conductor_density"
shape = "percentile_rising"
params = { p_lo = 50.0, p_hi = 95.0 }
weight = 0.0
status = "folklore"
evidence = """Recorded in Jefferson et al. 2007 as personal communication: "better conductors were better U \
targets historically" and "there is a correlation between conductor strength (conductance) and deposit size and \
grade". The literature states plainly that these "are not backed by a published statistical \
study"."""
caveat = """Weight zero, and it would stay zero even with a conductance field, because no published test \
exists. The public layer carries no conductance at all, so density stands in, which is not the same quantity."""

[[criterion]]
key = "em_bright_spot"
title = "EM bright spots correlate with known occurrences"
element = "pathway"
feature = "conductor_density"
shape = "percentile_rising"
params = { p_lo = 90.0, p_hi = 99.0 }
weight = 0.0
status = "folklore"
evidence = """Also personal communication in Jefferson et al. 2007: "EM bright spots tend to correlate with \
known U occurrences", with no published statistical test."""
caveat = """Correlating with known occurrences is what the exploration-effort null model exists to detect, so \
even if tested this would need to beat that baseline before it could carry weight."""
