verified_at = "2026-09-18"
fields_verified = true
notes = """COGs on the public sentinel-cogs bucket; a SWIR asset returned HTTP 200 unauthenticated and a 0.5 by 0.3 degree box over the basin matched 27 scenes under 10% cloud in one summer. Jobs: a lake and wetland mask (the sampling frame for the lake geochemistry), cover versus outcrop, and true-colour and SWIR chips for each candidate cell."""
caveats = [
  "Athabasca deposits sit 100 to 900 m down under 1 to 2 km of sandstone: no optical sensor sees them, and this layer is never an ore detector here.",
  "A frontier model scored 0.369 on geological map understanding (report 02, 4.4), so an agent may describe ground context from a chip but must not claim alteration from it.",
  "Clay alteration is detectable by SWIR only where it reaches the surface; in this basin it generally does not.",
]

