# ---------------------------------------------------------------- gaps: recorded so nothing pretends otherwise

[[gap]]
key = "aeromagnetic_grids"
title = "Airborne magnetic, radiometric and gravity grids"
why_it_matters = "Magnetics and radiometrics are the standard first-pass Athabasca datasets, and gravity carries the quartz-dissolution signal. Their absence is the biggest hole in any public model of this basin."
status = "published_not_pulled"
evidence = """Re-verified 2026-09-19 (PRD section B, Phase 2): the earlier 'not addressable' was wrong on magnetics. Natural Resources Canada publishes the Canadian Aeromagnetic Data Base compilation on the Open Government Portal under the Open Government Licence - Canada (dataset 752fe3fc-d871-5ae1-9bd9-2b6f65880a8d, modified 2020-10-05) with resources 'Canada - 200m - MAG - Residual Total Field' (ZIP), 'Canada - 1km - MAG - Residual Total Field', both first vertical derivatives, and a CAGDB WMS (images, not values). The file links (gdr.agg.nrcan.gc.ca dapid=140) redirect to the new portal at geophysical-data.canada.ca, whose download path has not yet been driven; the Northern Saskatchewan 100 m compilation lives behind the same portal. Radiometrics and gravity: unchanged, no value grid found. The provincial Geophysics service still publishes survey footprints only."""
workaround = "Until the 200 m grid is pulled: mapped lithology and interpreted magnetic domains stand in for the magnetic-low proxy; nothing stands in for radiometrics or gravity. The pull is a Phase 2 task, not a research question."

[[gap]]
key = "discovery_dates"
title = "Discovery dates for deposits and occurrences"
why_it_matters = "Without them there is no honest train-before, test-after split, which is the strongest test available short of drilling."
status = "not_published"
evidence = "No discovery-year, year-found or first-reported field exists in the SMDI REST layer or on an SMDI detail page; DISCOVERYTYPE is a method. Deposit footprints carry only report titles. Checked 2026-09-18."
workaround = "A hand-built table of about ten dated discoveries, each cited to a public technical report, used only as a hold-out; plus leave-one-camp-out spatial folds, which need no dates."

[[gap]]
key = "em_conductor_attributes"
title = "Conductance or strength on the EM conductor layer"
why_it_matters = "The folklore that stronger conductors make better targets could only be tested with a conductance value."
status = "unverified"
evidence = "Feature count confirmed at 28,458; the attribute list was not enumerated. Checked 2026-09-18."
workaround = "Criteria use distance and density only. The strength claims stay in the handbook marked as untested folklore, with weight zero."

[[gap]]
key = "alteration_measurements"
title = "Clay alteration and geochemical footprints at depth"
why_it_matters = "Alteration is the largest expression of the system: the Cigar Lake halo reaches about 100 m below and 300 m above the unconformity."
status = "not_public"
evidence = "Halo extents and Hinckley index ranges exist in the literature, but the measurements are in company drill logs, not in any public layer. Report 02 section 1.2."
workaround = "None. The handbook states the extents so an agent can say what would settle a cell, and the adjudicator is required to name it as an unknown rather than an absence."
