# Every data source this project can legally use over the Athabasca Basin, what it bears on, and what it costs
# to get. Counts and field lists were confirmed by live calls on the dates recorded here; anything not
# confirmed carries `verified = false` and must not be relied on until it is.
#
# `bears_on` uses the mineral-systems vocabulary, restricted to what the research reports actually support for
# the Athabasca: pathway, trap, detection (a measurable expression), dispersal (glacial transport of a signal),
# cover (what sits above the target), effort (where people looked, for the null model), label, study_area.
# Source and preservation are deliberately absent: research reports 01 and 02 do not give Athabasca-specific
# proxies for either, so no criterion may claim one.
#
# `tier` is the provenance tier the rows land in (see store/schema.sql). `role` is feature, label or context:
# a label may never enter a feature set.

schema_version = "1.0.0"
region_bbox = [-112.0, 55.5, -101.5, 60.0]
region_note = "the Athabasca Basin and its margins; the grid is the basin outline buffered 30 km"

# ---------------------------------------------------------------- vector, Saskatchewan Geological Survey
# One licence covers every `gis.saskatchewan.ca/egis` layer below.

[licence.sk]
name = "Government of Saskatchewan Standard Unrestricted Use Data Licence v2.0"
url = "https://gisappl.saskatchewan.ca/Html5Ext/Resources/GOS_Standard_Unrestricted_Use_Data_Licence_v2.0.pdf"
terms = "worldwide, royalty-free, perpetual, non-exclusive, commercial use permitted, attribution required"
redistributable = true

[licence.copernicus]
name = "Copernicus Sentinel Data Licence"
url = "https://sentinels.copernicus.eu/web/sentinel/terms-conditions"
terms = "free, worldwide, commercial use permitted, attribution required"
redistributable = true

[licence.usgs_pd]
name = "USGS public domain"
url = "https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits"
terms = "public domain, no restriction"
redistributable = true

[licence.ogl_canada]
name = "Open Government Licence - Canada"
url = "https://open.canada.ca/en/open-government-licence-canada"
terms = "Worldwide, royalty-free, perpetual, non-exclusive licence to copy, modify, publish, translate, adapt, distribute or otherwise use the information in any medium, with attribution to the information provider."
redistributable = true

[licence.not_stated]
name = "no licence stated"
url = ""
terms = "used but never redistributed; the public-safe build omits it"
redistributable = false

[[source]]
key = "em_conductors"
title = "EM conductors (interpreted)"
tier = "native"
role = "feature"
bears_on = "pathway"
access = "arcgis_rest"
url = "https://gis.saskatchewan.ca/egis/rest/services/Economy/Regional_Datasets_and_Compilations/FeatureServer/7"
where = "1=1"
geometry = "polyline"
record_count = 28458
licence = "sk"
verified = true
verified_at = "2026-09-18"
fields_verified = false
notes = """Graphitic basement units are "the source of most significant conductors in the Athabasca Basin, and are key empirical locators for U deposits" (Jefferson et al. 2007, via research report 02 section 1.1.3). This is the single most valuable public feature here."""
caveats = [
  "Conductor traces plot up-dip of blind ore, so a buffer must extend down-dip rather than being symmetric (report 02, 1.1.3).",
  "Silicification can turn graphitic gneiss from a conductor into a resistor, so absence is not evidence of absence.",
  "The Wolverine Point Formation is itself a conductor and hinders detection of graphitic units beneath it.",
  "Attribute list not yet confirmed: do not assume a conductance field exists.",
  "Compiled as it stands today, partly from surveys flown after the discoveries it now sits near: a hindcast using it is optimistic.",
]

