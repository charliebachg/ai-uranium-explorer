# Dated discoveries for the hindcast (PRD C.2.3): the only honest "prediction before the claim" test short of
# drilling. Each entry is a deposit or occurrence in the label layers, the year the discovery was made public,
# the public document it is cited to, and a confidence: `high` means the year is stated in the cited document
# or is a matter of record across several public sources; `medium` means the year is well known but was not
# checked against the document named here in this session. The hindcast reports both sets separately.
#
# What "discovery year" means here: the year the first mineralised intersection at the named body was made,
# as public sources state it. A deposit named for a zone first drilled years after the camp opened carries the
# zone's year, not the camp's. Cells are the label cells that carry the name in derived.cell_label.

version = "discoveries/v1"
