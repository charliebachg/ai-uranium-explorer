# The enabled cells: the only cells whose assessment files are pre-read and whose analyst chains are
# computed and shown in the dashboard (the PRD's scope rule for the enabled cells). Frozen 2026-09-19.
#
# Selection rule, in three parts, each stratum chosen by a rule rather than by hand:
#   demo      the five cells the panel memos and the recorded chat already used, chosen for score behaviour
#   read      the cells of the four reports already read in Phase 2 of the reading pipeline
#   deposit   two deposit cells per camp with the fewest attached files that still carry drilling
# Reading rule: for each enabled cell, fetch and text-index every assessment file inside it (no model
# calls); model-read only the two files with the most drillholes.

version = "enabled-cells/v1"
frozen_at = "2026-09-19"
read_rule = "top 2 files by drillhole count per cell; the rest fetched and indexed only"

