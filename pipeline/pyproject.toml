[project]
name = "ai-uranium-explorer"
version = "0.1.0"
description = "Reads public Saskatchewan uranium assessment reports into drillhole tables with provenance, and measures how often the reading is wrong."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.5",
  "typer==0.26.8",
  "httpx==0.28.1",
  "tenacity==9.1.4",
  "duckdb==1.5.5",
  "pyarrow==25.0.1",
  "geopandas==1.1.4",
  "shapely==2.1.2",
  "pyproj==3.8.0",
  "rapidfuzz==3.14.6",
  "pillow==12.3.0",
  "pypdfium2==5.13.0",
  "ocrmac==1.0.1; sys_platform == 'darwin'",   # Apple Vision OCR: reading pages happens on the Mac, never in the serving image
  "openpyxl",
  "xlrd",
  "jinja2",
  "scikit-learn>=1.9.1",
  "rasterio>=1.5.1",
  "pystac-client>=0.9.0",
  "fastapi==0.135.2",
  "uvicorn[standard]==0.43.0",
  "sqlalchemy==2.0.46",
  "alembic==1.18.4",
  "psycopg[binary]==3.3.3",
  "mcp==2.2.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",   # the same 1.44.0 as the SDK MLflow brought in; imported only when UE_OTLP_ENDPOINT is set
  "boto3==1.43.98",   # the seed pack over S3 (the compose MinIO locally, any S3 elsewhere)
]

[project.optional-dependencies]
layout = ["docling[ocrmac]==2.128.0"]
mlflow = ["mlflow==3.16.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "moto==5.2.3",
    "ruff==0.16.8",
]   # moto: the S3 seed transport is tested against a fake bucket, no network

[project.scripts]
ue = "uranium_explorer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uranium_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs internet (grid download, live endpoints)",
  "backend: calls the real claude CLI",
  "real_data: runs against the live analytics store (data/ue.duckdb, or the unpacked seed); UE_REAL_DATA=1 to enable",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E9", "B006", "B007"]
